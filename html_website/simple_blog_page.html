<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Page</title>
    <link rel="stylesheet" href="../css/base_page.css">
    <link rel="stylesheet" href="../css/blog_page.css">
</head>
    <body onload="get()">
        
        <div id="nav-container"></div>

        <main>
            <h1 class="header">Blog Page</h1>

            <br>

            <div id="content">
                <label for="post"><h3>Write a Post</h3></label>
                
                <br>

                <textarea 
                    id="post" 
                    name="post" 
                    rows="6" 
                    cols="50" 
                    placeholder="Type your blog post here...">
                </textarea>

                <br>

                <!-- TODO: I want the button to be able to save information to the database 
                 for the website so that blogs that are saved can be posted at a later time 
                 instead of in that moment. -->
                <button 
                    id="save-button" 
                    type="button"
                    onclick="save()"
                    >Save
                </button>

                <button 
                    id="post-button" 
                    type="button"
                    >Post
                </button>

            </div>

            <div id="post-info">
                <p id ="savedText"></p>
                <p id ="openedText"></p>
            </div>
        </main>

        <footer>
            <p>© 2026 CEOHurdleHopper. All rights reserved.</p>
        </footer>
            
        <script src="../js/navbar.js"></script>
        <script src="../js/blogPage.js"></script>
    </body>
</html>
